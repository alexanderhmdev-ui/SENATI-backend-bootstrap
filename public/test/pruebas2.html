<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    * {
      padding: 0px;
      margin: 0px;
      border: 0px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: normal;
    }

    .contenedor {
      width: 90%;
      margin: 0 auto;
      background-color: antiquewhite;
      padding: .5rem;
      text-align: center;
    }

    .tarjeta {
      padding: 1rem;
      width: 350px;
      background-color: aqua;
      display: inline-block;
      border-radius: 10px;
      margin-bottom: .25rem;
    }

    .tarjeta a {
      text-decoration: none;
      font-size: 12px;
    }

    .tarjeta a:hover {
      text-decoration: underline;
    }

    .tarjeta h5 {
      font-style: italic;
      margin-bottom: .25rem;
    }
  </style>
  <select name="selector-carreras" id="selector-carreras">
    <option value="">Mostrar todas</option>
    <option value="Ingieneria de Software">Ingieneria de Software</option>
    <option value="Diseño Gráfico">Diseño Gráfico</option>
    <option value="Administración Industrial">Administración Industrial</option>
  </select>

  <div class="contenedor">

  </div>
  <script>
    const alumnos = [

      {
        apellidos: "Huaman Mendoza",
        nombres: "Alexander",
        carrera: "Ingieneria de Software",
        telefono: "929786771",
        correo: "alexanderhm.dev@gmail.com"
      },

      {
        apellidos: "Martinez Crisostomo",
        nombres: "Margarita",
        carrera: "Diseño Gráfico",
        telefono: "999888777",
        correo: "margaritadg1@gmail.com"
      },

      {
        apellidos: "Flores Atuncar",
        nombres: "Arturo José",
        carrera: "Ingieneria de Software",
        telefono: "956111000",
        correo: "arturo@gmail.com"
      },

      {
        apellidos: "Penaloza Perez",
        nombres: "Carlos",
        carrera: "Administración Industrial",
        telefono: "956444777",
        correo: "carlos@gmail.com"
      },

      {
        apellidos: "Quintana Perea",
        nombres: "Flor Katherine",
        carrera: "Diseño Gráfico",
        telefono: "956777000",
        correo: "flor@gmail.com"
      },

      {
        apellidos: "Quiroga Martinez",
        nombres: "Ashley",
        carrera: "Diseño Gráfico",
        telefono: "911223333",
        correo: "ashley@gmail.com"
      }
    ]

    const contenedor = document.querySelector(".contenedor")
    const selector = document.getElementById('selector-carreras')

    selector.addEventListener("change", function(){
      renderizarTarjetas(selector.value)
    })

    function renderizarTarjetas(carrera = "") {
      let listaFiltrada = []
      contenedor.innerHTML = ''

//operador ternario
      listaFiltrada = 
        carrera.trim() === ""
        ? alumnos
        : alumnos.filter(alumno => alumno.carrera == carrera)

      listaFiltrada.forEach(alumno => {
        const nuevaTarjeta = `
         <div class="tarjeta">
          <h4>${alumno.apellidos} ${alumno.nombres}</h4>
          <h5>${alumno.carrera}</h5>
          <a href="tel:${alumno.telefono} ">Contactar</a>
          <a href="mailto:${alumno.correo}">Enviar correo</a>
        </div>
        `

        contenedor.innerHTML += nuevaTarjeta
      })
    }

    renderizarTarjetas("")
  </script>
</body>

</html>
